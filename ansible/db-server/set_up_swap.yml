- name: Configure swap memory
  hosts: db-server
  become: yes

  tasks:
    - name: Check if swap file exists
      stat:
        path: "{{ swap_file_path }}"
      register: swap_stat

    - name: Create swap file
      command: "dd if=/dev/zero of={{ swap_file_path }} bs=1M count={{ swap_size_gb | int * 1048 }}"
      when: not swap_stat.stat.exists

    - name: Set swap file permissions
      file:
        path: "{{ swap_file_path }}"
        mode: '0600'

    - name: Format swap file
      command: "mkswap {{ swap_file_path }}"
      when: not swap_stat.stat.exists

    - name: Enable swap file
      command: "swapon {{ swap_file_path }}"
      register: swapon_output
      failed_when: false
      changed_when: "'already active' not in swapon_output.stderr"

    - name: Add swap to fstab for persistence
      mount:
        name: none
        src: "{{ swap_file_path }}"
        fstype: swap
        opts: sw
        passno: 0
        dump: 0
        state: present