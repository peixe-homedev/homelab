---
- name: Prepare Nextcloud Docker Host
  hosts: fileserver-01
  become: yes

  tasks:
    # ==========================================
    # 1. SWAP CONFIGURATION (Your solid code)
    # ==========================================
    - name: Check if swap file exists
      stat:
        path: "{{ swap_file_path }}"
      register: swap_stat

    - name: Create swap file
      command: "fallocate -l {{ swap_size_gb }}G {{ swap_file_path }}"
      when: not swap_stat.stat.exists

    - name: Set swap file permissions
      file:
        path: "{{ swap_file_path }}"
        mode: '0600'

    - name: Format swap file
      command: "mkswap {{ swap_file_path }}"
      when: not swap_stat.stat.exists

    - name: Enable swap file
      command: "swapon {{ swap_file_path }}"
      register: swapon_output
      failed_when: false
      changed_when: "'already active' not in swapon_output.stderr"

    - name: Add swap to fstab for persistence
      mount:
        name: none
        src: "{{ swap_file_path }}"
        fstype: swap
        opts: sw
        passno: 0
        dump: 0
        state: present

    # ==========================================
    # 2. DOCKER INSTALLATION
    # ==========================================
    - name: Install Docker Engine
      apt:
        name: docker.io
        state: present
        update_cache: yes

    - name: Ensure Docker is started and enabled
      systemd:
        name: docker
        state: started
        enabled: yes

    - name: Create Docker CLI plugins directory
      file:
        path: /usr/local/lib/docker/cli-plugins
        state: directory
        mode: '0755'

    - name: Download Docker Compose V2 plugin
      get_url:
        url: https://github.com/docker/compose/releases/download/v2.26.1/docker-compose-linux-x86_64
        dest: /usr/local/lib/docker/cli-plugins/docker-compose
        mode: '0755'

    # ==========================================
    # 3. THE "MAGIC" SMB MOUNT
    # ==========================================
    - name: Create mount point directory
      file:
        path: "{{ mount_path }}"
        state: directory
        mode: '0755'

    - name: Create SMB credentials file
      copy:
        dest: "/etc/wd_cloud.cred"
        content: |
          username={{ smb_user }}
          password={{ smb_pass }}
        owner: root
        group: root
        mode: '0600'
      no_log: true

    - name: Mount the WD Cloud share and add to fstab
      mount:
        path: "{{ mount_path }}"
        src: "{{ smb_share }}"
        fstype: cifs
        # The Magic happens here: uid=33, gid=33
        opts: "credentials=/etc/wd_cloud.cred,iocharset=utf8,vers=3.0,uid=33,gid=33,dir_mode=0770,file_mode=0660,noperm"
        state: mounted