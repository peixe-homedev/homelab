[defaults]
inventory = inventory.ini
host_key_checking = False
# Fixes the 'remote_tmp' warning by using a world-writable path
remote_tmp = /tmp/.ansible-${USER}/tmp
# Ensures Ansible finds your collections in the system path we identified
collections_path = /usr/lib/python3/dist-packages/ansible_collections:~/.ansible/collections

[ssh_connection]
# Fixes the becoming-user permission issues and speeds up execution
pipelining = True
