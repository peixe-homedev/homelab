---
- name: Install Portainer
  hosts: docker-01
  become: yes
  tasks:
    - name: Install Python Docker SDK
      apt:
        name: 
          - python3-docker
          - python3-pip 
        state: present
        update_cache: yes

    - name: Create Portainer data volume
      docker_volume:
        name: portainer_data

    - name: Run Portainer container
      docker_container:
        name: portainer
        image: portainer/portainer-ce:latest
        state: started
        restart_policy: always
        ports:
          - "8000:8000"
          - "9443:9443"
        volumes:
          - "/var/run/docker.sock:/var/run/docker.sock"
          - "portainer_data:/data"